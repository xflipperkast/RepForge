name: iOS simulator UI smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  simulator-launch:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Generate original RepForge icon
        run: swift Scripts/generate_app_icon.swift
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Select available iPhone simulator
        shell: bash
        run: |
          xcrun simctl list devices available -j > /tmp/simulators.json
          SIM_ID=$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/simulators.json'))
          candidates=[]
          for runtime, devices in data.get('devices', {}).items():
              if 'iOS' not in runtime: continue
              for device in devices:
                  if 'iPhone' in device.get('name','') and device.get('isAvailable',True):
                      candidates.append(device)
          if not candidates: raise SystemExit('No available iPhone simulator')
          print(candidates[0]['udid'])
          PY
          )
          echo "SIM_ID=$SIM_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM_ID"
          xcrun simctl bootstatus "$SIM_ID" -b
      - name: Compile for iOS simulator
        run: |
          set -o pipefail
          xcodebuild -project RepForge.xcodeproj \
            -scheme RepForge \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath sim-build \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Install, launch and screenshot
        run: |
          APP="sim-build/Build/Products/Debug-iphonesimulator/RepForge.app"
          test -f "$APP/Info.plist"
          xcrun simctl install "$SIM_ID" "$APP"
          xcrun simctl launch "$SIM_ID" com.xflipperkast.repforge
          sleep 5
          mkdir -p screenshots
          xcrun simctl io "$SIM_ID" screenshot screenshots/forge-v3-home.png
          test -s screenshots/forge-v3-home.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ForgeV3-simulator-screenshot
          path: screenshots/
          if-no-files-found: ignore
