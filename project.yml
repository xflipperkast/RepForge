name: RepForge
options:
  bundleIdPrefix: com.xflipperkast
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 23
    MARKETING_VERSION: 0.3.0
targets:
  RepForge:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared
    dependencies:
      - target: RepForgeLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xflipperkast.repforge
        INFOPLIST_FILE: RepForge/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

  RepForgeLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: RepForgeLiveActivity
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xflipperkast.repforge.liveactivity
        INFOPLIST_FILE: RepForgeLiveActivity/Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO

  RepForgeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RepForgeUITests
    dependencies:
      - target: RepForge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xflipperkast.repforge.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
